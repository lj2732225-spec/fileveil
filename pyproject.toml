[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileveil"
version = "0.1.0"
description = "Remove hidden metadata from files before sharing them."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "FileVeil contributors"}]
keywords = ["privacy", "metadata", "security", "exif", "office"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Utilities",
]

[project.scripts]
fileveil = "fileveil.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py39"

